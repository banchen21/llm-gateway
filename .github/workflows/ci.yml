name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `pnpm build` runs vue-tsc first, so this is both a type check and a build.
      - run: pnpm build
      # The GUI is embedded into the binaries at compile time, so the Rust jobs need it.
      - uses: actions/upload-artifact@v4
        with:
          name: gui-dist
          path: apps/desktop/dist
          retention-days: 1

  rust:
    name: Rust (core + server)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gui-dist
          path: apps/desktop/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy -p gateway-core -p gateway-server --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p gateway-core -p gateway-server

  desktop:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gui-dist
          path: apps/desktop/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check the shell
        run: cargo check -p llm-gateway-desktop
