name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste real API keys. Redact them as `sk-…`.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The behaviour you saw, and the request that produced it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - Desktop app
        - Headless gateway (`gateway-server`)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: output of `git rev-parse --short HEAD`
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: The gateway log lives at `<config dir>/logs/requests.jsonl`; it records shapes and token counts, never message bodies.
      render: text
